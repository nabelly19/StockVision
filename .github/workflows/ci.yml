name: CI - Build & Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore FinanceAI.slnx

      - name: Build
        working-directory: backend
        run: dotnet build FinanceAI.slnx --no-restore --configuration Release

      - name: Run Tests
        working-directory: backend
        run: dotnet test FinanceAI.slnx --no-build --verbosity normal